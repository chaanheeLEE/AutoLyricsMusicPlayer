<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradA" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#272436"/>
      <stop offset="55%" stop-color="#1a1924"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <radialGradient id="topGlowA" cx="50%" cy="28%" r="52%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGradA" x1="16" y1="16" x2="496" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8ccff" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#9b87f5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="waveGradA" x1="128" y1="104" x2="384" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="48%" stop-color="#b4a5fa"/>
      <stop offset="100%" stop-color="#7c5dfa"/>
    </linearGradient>
    <linearGradient id="lyricActiveA" x1="152" y1="322" x2="388" y2="322" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d6ccff"/>
      <stop offset="100%" stop-color="#9e8cfc"/>
    </linearGradient>
    <filter id="glowA" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- True transparent outside dark squircle -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGradA)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#topGlowA)"/>
  <rect x="21.5" y="21.5" width="469" height="469" rx="106.5" stroke="url(#borderGradA)" stroke-width="3"/>

  <!-- Play + Equalizer Soundwave Centerpiece -->
  <g filter="url(#glowA)">
    <!-- Rounded Play Icon -->
    <path d="M126 134 C126 121 140 113 151 120 L226 168 C236 174 236 189 226 195 L151 243 C140 250 126 242 126 229 Z" fill="url(#waveGradA)"/>
    <!-- Soundwave Bars -->
    <rect x="256" y="148" width="24" height="68" rx="12" fill="url(#waveGradA)" opacity="0.9"/>
    <rect x="296" y="114" width="24" height="136" rx="12" fill="url(#waveGradA)"/>
    <rect x="336" y="132" width="24" height="100" rx="12" fill="url(#waveGradA)" opacity="0.92"/>
    <rect x="376" y="158" width="24" height="48" rx="12" fill="url(#waveGradA)" opacity="0.82"/>
  </g>

  <!-- Subtle Divider -->
  <line x1="112" y1="286" x2="400" y2="286" stroke="#b4a5fa" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round"/>

  <!-- Active Synced Lyric Line -->
  <g filter="url(#glowA)">
    <circle cx="132" cy="332" r="11" fill="#b4a5fa"/>
    <rect x="160" y="320" width="232" height="24" rx="12" fill="url(#lyricActiveA)"/>
  </g>

  <!-- Upcoming Lyric Line -->
  <circle cx="132" cy="384" r="8" fill="#8b88a8" fill-opacity="0.35"/>
  <rect x="160" y="374" width="168" height="20" rx="10" fill="#9a95b8" fill-opacity="0.34"/>
</svg>
