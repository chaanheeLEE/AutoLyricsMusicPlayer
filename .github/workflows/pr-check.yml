name: PR Check

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Syntax Check
        run: npm run check

      - name: Run Unit Tests
        run: npm test

      - name: Preview Release Notes from updated.md
        run: node scripts/release-notes.js check
